<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Night Guard 設定</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    body { padding: 32px 20px; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 500; }
    h2 { font-size: 14px; color: var(--muted); font-weight: 500; margin: 28px 0 8px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .row label { font-size: 14px; }
    .row small { display: block; color: var(--muted); }
    input[type="number"] { width: 90px; text-align: right; }
    textarea { width: 100%; min-height: 110px; margin-top: 8px; }
    .banner { background: var(--panel); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 6px; margin: 12px 0; font-size: 14px; }
    .error { color: #ffb4b4; white-space: pre-line; font-size: 13px; min-height: 1.4em; }
    .ok { color: var(--accent); font-size: 13px; }
    .save { margin-top: 20px; display: flex; gap: 14px; align-items: center; }
  </style>
</head>
<body>
  <main>
    <h1>🌙 Night Guard 設定</h1>
    <div class="banner" id="lockBanner" hidden>
      制限中のため、設定は表示のみです。朝の自動解除のあとに変更できます。
    </div>

    <h2>時刻</h2>
    <div class="row"><label for="prepareTime">寝る準備の通知</label><input id="prepareTime" type="time" /></div>
    <div class="row"><label for="softTime">Shorts・X・Instagram を制限</label><input id="softTime" type="time" /></div>
    <div class="row"><label for="hardTime">YouTube 全体を制限</label><input id="hardTime" type="time" /></div>
    <div class="row"><label for="releaseTime">自動解除</label><input id="releaseTime" type="time" /></div>
    <div class="row"><label for="wakeTime">起床時刻<small>ブロック画面の睡眠時間の計算に使います</small></label><input id="wakeTime" type="time" /></div>

    <h2>一時解除</h2>
    <div class="row"><label for="waitSeconds">待ち時間（秒）</label><input id="waitSeconds" type="number" min="0" max="600" /></div>
    <div class="row"><label for="unlockMinutes">解除時間（分）</label><input id="unlockMinutes" type="number" min="1" max="180" /></div>

    <h2>許可する YouTube 再生リスト（BGM 用）</h2>
    <label for="playlists" style="font-size:13px;color:var(--muted)">1行に1つ。再生リストの URL か ID（URL の list= の値）</label>
    <textarea id="playlists" spellcheck="false" placeholder="https://www.youtube.com/playlist?list=PL..."></textarea>

    <div class="save">
      <button class="primary" id="save">保存</button>
      <span class="ok" id="ok"></span>
    </div>
    <div class="error" id="error"></div>
    <div id="debugRoot"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
