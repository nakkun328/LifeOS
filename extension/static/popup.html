<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Night Guard</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    body { width: 280px; padding: 16px; }
    h1 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 500; }
    .stage { font-size: 18px; font-weight: 600; color: var(--accent); }
    dl { margin: 14px 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    button { width: 100%; font-size: 13px; }
    #devTime { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>🌙 Night Guard</h1>
  <div class="stage" id="stage">--</div>
  <dl>
    <dt id="nextLabel">次の段階</dt><dd id="next">--</dd>
    <dt>今夜の解除回数</dt><dd id="unlocks">--</dd>
  </dl>
  <div id="devTime"></div>
  <div id="focusSetup" style="display:grid;grid-template-columns:1fr 70px;gap:6px;margin-bottom:6px">
    <select id="mode" style="font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px">
      <option value="50-10">50分集中 / 10分休憩</option>
      <option value="25-5">25分集中 / 5分休憩</option>
    </select>
    <input id="sets" type="number" min="1" max="8" value="3" title="セット数" style="font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px" />
  </div>
  <div id="planInfo" style="font-size:12px;color:var(--muted);margin-bottom:6px"></div>
  <button id="focus" class="primary" style="margin-bottom:6px">集中を始める</button>
  <div id="focusMsg" style="font-size:12px;color:var(--muted);min-height:1.4em;margin-bottom:10px"></div>
  <button id="bed" style="margin-bottom:8px">寝る（記録する）</button>
  <div id="bedMsg" style="font-size:12px;color:var(--muted);min-height:1.4em;margin-bottom:6px"></div>
  <button id="options">設定を開く</button>
  <div id="sync" style="font-size:11px;color:var(--muted);margin-top:8px"></div>
  <script src="popup.js"></script>
</body>
</html>
